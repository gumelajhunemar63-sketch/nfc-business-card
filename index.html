<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Digital Business Card</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#17202a}
.card{max-width:430px;margin:0 auto;min-height:100vh;background:white;text-align:center}
.hero{padding:34px 22px 24px;background:linear-gradient(135deg,#123c32,#2d735d);color:white}
.avatar{width:96px;height:96px;border-radius:50%;margin:auto;background:#dce9e4;display:flex;align-items:center;justify-content:center;font-size:36px;color:#28594b;border:4px solid white}
h1{margin:15px 0 5px;font-size:28px}
.role{opacity:.9;margin:0}
.bio{padding:22px 28px 10px;color:#5b6570;line-height:1.5}
.buttons{padding:10px 22px 25px}
a{display:block;text-decoration:none;margin:12px 0;padding:15px;border-radius:12px;font-weight:700}
.primary{background:#123c32;color:white}
.secondary{background:#eef3f1;color:#123c32}
.social{display:flex;gap:10px;justify-content:center;padding:4px 22px 30px}
.social a{margin:0;padding:11px 15px;background:#f0f2f3;color:#333}
.footer{padding:20px;color:#9aa1a8;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <section class="hero">
    <div class="avatar">JD</div>
    <h1>Juan Dela Cruz</h1>
    <p class="role">Business Owner • ABC Trading</p>
  </section>
  <p class="bio">Welcome to my digital business card. Tap any button below to connect with me or learn more about my business.</p>
  <div class="buttons">
    <a class="primary" href="#">📞 Call Me</a>
    <a class="primary" href="#">💬 Message Me</a>
    <a class="secondary" href="#">💾 Save Contact</a>
    <a class="secondary" href="#">📍 Visit My Business</a>
    <a class="secondary" href="#">🌐 Visit Website</a>
  </div>
  <div class="social">
    <a href="#">Facebook</a><a href="#">Instagram</a><a href="#">TikTok</a>
  </div>
  <div class="footer">Powered by Your NFC Business Card</div>
</div>
</body>
</html>
